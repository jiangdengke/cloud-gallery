name: Deploy

# 触发条件：仅当推送以 'v' 开头的 Tag 时触发 (例如 v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
    - uses: actions/checkout@v4

    # --- 前端部分 ---
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Build Frontend
      run: |
        cd web
        npm install
        npm run build

    # --- 上传文件 ---
    - name: Upload Frontend Assets
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "web/dist/*"
        target: "/var/www/cloud-gallery/public"
        strip_components: 2

    # --- SSH 部署 (Docker Compose) ---
    - name: Deploy via Docker Compose
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          # ⚠️⚠️⚠️ 请修改为您服务器的实际路径 ⚠️⚠️⚠️
          PROJECT_PATH="/var/www/cloud-gallery"

          echo "🚀 开始 Docker 部署到 $PROJECT_PATH ..."
          
          # 确保目录存在
          mkdir -p $PROJECT_PATH
          cd $PROJECT_PATH

          # 1. 智能拉取代码 (自动处理首次部署)
          # 注意：.env 文件应已存在于服务器或仓库中
          if [ ! -d ".git" ]; then
            echo "📂 检测到项目未初始化，开始首次克隆..."
            git init
            # 使用 HTTPS URL (如果是私有仓库，请确保服务器配置了凭证助手，或者改用 SSH URL)
            git remote add origin https://github.com/jiangdengke/cloud-gallery.git
            git fetch origin master
            # 强制重置代码，覆盖本地冲突 (注意：这不会删除未追踪的 .env)
            git reset --hard origin/master
            git branch --set-upstream-to=origin/master master
          else
            echo "🔄 检测到已有项目，拉取最新代码..."
            git pull origin master
          fi

          # 2. 停止旧服务
          echo "🛑 停止旧服务..."
          docker compose down

          # 3. 清理并安装依赖
          echo "🧹 清理旧依赖..."
          # 必须在宿主机执行，确保挂载卷是干净的
          rm -rf vendor composer.lock 
          # 注意：删掉 composer.lock 会导致升级到最新依赖，如果想锁版本，不要删 lock。
          # 但如果 lock 文件有冲突，删了可以解决问题。既然是生产环境，最好保留 lock。
          # 这里只删 vendor。
          rm -rf vendor

          echo "📦 安装依赖..."
          # 这里会重新生成 vendor 到宿主机挂载目录
          docker compose run --rm app composer install --no-dev --optimize-autoloader

          # 4. 启动服务
          echo "🚀 启动新服务..."
          docker compose up -d --build

          # 5. 等待数据库准备好
          echo "⏳ 等待服务就绪..."
          sleep 10

          # 6. 执行维护命令
          echo "🗄️ 迁移数据库..."
          docker compose run --rm app php artisan migrate --force

          echo "🔗 建立软链..."
          docker compose run --rm app php artisan storage:link || true

          echo "🧹 清理缓存..."
          docker compose run --rm app php artisan config:cache
          docker compose run --rm app php artisan route:cache
          docker compose run --rm app php artisan view:cache
          
          # 7. 修改权限
          chmod -R 777 storage bootstrap/cache

          echo "✅ Docker 部署完成！"
          
          # 5. 修改权限 (确保容器内的 www-data 能写入宿主机挂载的 storage)
          # 宿主机的用户可能需要 root 权限执行这个，或者确保目录权限宽松
          chmod -R 777 storage bootstrap/cache

          echo "✅ Docker 部署完成！"